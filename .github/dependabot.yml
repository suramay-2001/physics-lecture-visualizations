# Weekly update PRs: both npm lockfiles and the SHA-pinned workflow actions (keeps the pins current).
version: 2
updates:
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /films
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
